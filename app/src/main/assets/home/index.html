<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Yeni Sekme</title>
<style>
  :root {
    --bg:#f5f6fa; --surface:#ffffff; --border:#e4e6ef; --text:#202133; --text-dim:#7a7d94;
    --accent:#5b5bf0; --accent2:#7a4fe0;
  }
  [data-theme="true"] {
    --bg:#0f0f14; --surface:#1a1a24; --border:#2a2a3a; --text:#e8e8ee; --text-dim:#8a8a9a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow-x: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, Roboto, "Segoe UI", Arial, sans-serif;
  }
  #bgCanvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
  .page {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100%;
    padding: 11vh 20px 40px 20px;
  }
  .logo-mark { width: 64px; height: 64px; margin-bottom: 14px; filter: drop-shadow(0 6px 14px rgba(91,91,240,.28)); }
  .logo-text { font-size: 26px; font-weight: 800; letter-spacing: -0.3px; margin-bottom: 26px; }
  .logo-text .dim { color: var(--text-dim); font-weight: 600; }

  form.search {
    width: 100%; max-width: 440px; height: 52px;
    background: rgba(255,255,255,.9); backdrop-filter: blur(6px);
    border: 1px solid var(--border); border-radius: 999px;
    display: flex; align-items: center; padding: 0 8px 0 18px; gap: 10px;
    box-shadow: 0 10px 28px rgba(30,30,60,.08);
    transition: box-shadow .2s ease, transform .15s ease;
  }
  form.search:focus-within { box-shadow: 0 10px 30px rgba(91,91,240,.22); transform: translateY(-1px); }
  form.search svg { width: 18px; height: 18px; stroke: var(--text-dim); fill: none; stroke-width: 2; flex-shrink: 0; }
  form.search input { flex: 1; border: none; outline: none; background: transparent; font-size: 15px; color: var(--text); }
  form.search button {
    width: 38px; height: 38px; border-radius: 50%; border: none;
    background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  form.search button svg { stroke: #fff; width: 16px; height: 16px; }

  .quick-links {
    display: grid; grid-template-columns: repeat(3, 86px); gap: 20px; margin-top: 40px; justify-content: center;
  }
  .quick-link { display: flex; flex-direction: column; align-items: center; gap: 8px; text-decoration: none; }
  .qcard {
    width: 58px; height: 58px; border-radius: 18px;
    background: rgba(255,255,255,.85); backdrop-filter: blur(4px);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 16px rgba(30,30,60,.06);
    transition: transform .15s ease;
  }
  .quick-link:active .qcard { transform: scale(.94); }
  .qcard svg { width: 24px; height: 24px; stroke: var(--accent); fill: none; stroke-width: 1.8; }
  .qlabel { font-size: 11px; color: var(--text-dim); text-align: center; }
</style>
</head>
<body>
  <canvas id="bgCanvas"></canvas>

  <div class="page">
    <svg class="logo-mark" viewBox="0 0 108 108">
      <defs>
        <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#5b5bf0"/><stop offset="1" stop-color="#7a4fe0"/>
        </linearGradient>
      </defs>
      <path d="M54,30 L32,72" stroke="url(#g1)" stroke-width="6" stroke-linecap="round"/>
      <path d="M32,72 L76,72" stroke="url(#g1)" stroke-width="6" stroke-linecap="round"/>
      <path d="M76,72 L54,30" stroke="url(#g1)" stroke-width="6" stroke-linecap="round"/>
      <path fill="url(#g1)" d="M54,22 L62,30 L54,38 L46,30 Z"/>
      <path fill="url(#g1)" d="M32,64 L40,72 L32,80 L24,72 Z"/>
      <path fill="url(#g1)" d="M76,64 L84,72 L76,80 L68,72 Z"/>
    </svg>
    <div class="logo-text">Nexus<span class="dim"> Browser</span></div>

    <form class="search" action="javascript:void(0)" id="searchForm">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="text" id="q" placeholder="Web'de arayın veya bir adres yazın" autocomplete="off" />
      <button type="submit" aria-label="Ara"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </form>

    <div class="quick-links">
      <a class="quick-link" href="https://www.youtube.com">
        <div class="qcard"><svg viewBox="0 0 24 24"><path d="M22 12s0-3.5-.4-5.1c-.3-.9-1-1.6-1.9-1.9C18 4.5 12 4.5 12 4.5s-6 0-7.7.5c-.9.3-1.6 1-1.9 1.9C2 8.5 2 12 2 12s0 3.5.4 5.1c.3.9 1 1.6 1.9 1.9 1.7.5 7.7.5 7.7.5s6 0 7.7-.5c.9-.3 1.6-1 1.9-1.9.4-1.6.4-5.1.4-5.1Z"/><path d="M10 15.2 15.5 12 10 8.8Z"/></svg></div>
        <div class="qlabel">YouTube</div>
      </a>
      <a class="quick-link" href="https://www.wikipedia.org">
        <div class="qcard"><svg viewBox="0 0 24 24"><path d="M4 5h4l4 10 4-10h4M4 5l6 14M20 5l-6 14"/></svg></div>
        <div class="qlabel">Wikipedia</div>
      </a>
      <a class="quick-link" href="https://www.github.com">
        <div class="qcard"><svg viewBox="0 0 24 24"><path d="M9 19c-4.3 1.4-4.3-2.5-6-3m12 5v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.2 4.2 0 0 0-.1-3.2s-1.1-.3-3.5 1.3a12.3 12.3 0 0 0-6.2 0C6.5 2.8 5.4 3.1 5.4 3.1a4.2 4.2 0 0 0-.1 3.2A4.6 4.6 0 0 0 4 9.5c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V21"/></svg></div>
        <div class="qlabel">GitHub</div>
      </a>
      <a class="quick-link" href="https://www.google.com/search?q=g%C3%BCncel%20haberler">
        <div class="qcard"><svg viewBox="0 0 24 24"><path d="M4 5h16v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg></div>
        <div class="qlabel">Haberler</div>
      </a>
      <a class="quick-link" href="https://www.google.com/search?q=online%20al%C4%B1%C5%9Fveri%C5%9F">
        <div class="qcard"><svg viewBox="0 0 24 24"><path d="M6 6h15l-1.5 9h-12Z"/><path d="M6 6 5 3H2"/><circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg></div>
        <div class="qlabel">Alışveriş</div>
      </a>
      <a class="quick-link" href="https://mail.google.com">
        <div class="qcard"><svg viewBox="0 0 24 24"><path d="M4 6h16v12H4Z"/><path d="m4 7 8 6 8-6"/></svg></div>
        <div class="qlabel">E-posta</div>
      </a>
    </div>
  </div>

  <script>
    document.getElementById('searchForm').addEventListener('submit', function () {
      var q = document.getElementById('q').value.trim();
      if (!q) return;
      var engine = 'google';
      try { engine = JSON.parse(window.AndroidHost.getSettingsJson()).searchEngine || 'google'; } catch (e) {}
      var urls = { google: 'https://www.google.com/search?q=', duckduckgo: 'https://duckduckgo.com/?q=', bing: 'https://www.bing.com/search?q=' };
      window.location.href = (urls[engine] || urls.google) + encodeURIComponent(q);
    });

    // ---- Hafif, zarif animasyonlu arka plan (yumuşak renkli daireler) ----
    (function () {
      var c = document.getElementById('bgCanvas');
      var ctx = c.getContext('2d');
      var w, h, dpr = Math.min(window.devicePixelRatio || 1, 2);
      function resize() {
        w = window.innerWidth; h = window.innerHeight;
        c.width = w * dpr; c.height = h * dpr;
        c.style.width = w + 'px'; c.style.height = h + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      resize();
      window.addEventListener('resize', resize);

      var blobs = [
        { x: 0.15, y: 0.18, r: 130, c: 'rgba(91,91,240,0.16)', dx: 0.00012, dy: 0.00009, t: 0 },
        { x: 0.85, y: 0.22, r: 160, c: 'rgba(122,79,224,0.13)', dx: -0.00010, dy: 0.00011, t: 2 },
        { x: 0.25, y: 0.82, r: 150, c: 'rgba(91,91,240,0.10)', dx: 0.00009, dy: -0.00010, t: 4 },
        { x: 0.80, y: 0.85, r: 120, c: 'rgba(122,79,224,0.14)', dx: -0.00011, dy: -0.00008, t: 6 }
      ];

      function frame(ts) {
        ctx.clearRect(0, 0, w, h);
        blobs.forEach(function (b) {
          var bx = (b.x + Math.sin(ts * b.dx + b.t) * 0.04) * w;
          var by = (b.y + Math.cos(ts * b.dy + b.t) * 0.04) * h;
          var grad = ctx.createRadialGradient(bx, by, 0, bx, by, b.r);
          grad.addColorStop(0, b.c);
          grad.addColorStop(1, 'rgba(255,255,255,0)');
          ctx.fillStyle = grad;
          ctx.beginPath(); ctx.arc(bx, by, b.r, 0, Math.PI * 2); ctx.fill();
        });
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
